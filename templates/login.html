{% extends "base.html" %}

{% block title %}Entrar — TiTu{% endblock %}

{% block content %}
<div class="auth-shell">
  <div class="auth-card">
    <h1>Entrar</h1>
    <p class="lede">Acesse seus experimentos e soluções titulantes.</p>

    {% if form.errors %}
    <p class="form-errors">Usuário ou senha incorretos. Tente novamente.</p>
    {% endif %}

    <form method="post" action="{% url 'login' %}">
      {% csrf_token %}

      <div class="field">
        <label for="id_username">Usuário</label>
        <input type="text" id="id_username" name="username" autocomplete="username" required autofocus>
      </div>

      <div class="field">
        <label for="id_password">Senha</label>
        <input type="password" id="id_password" name="password" autocomplete="current-password" required>
      </div>

      <button type="submit" class="btn btn-primary">Entrar</button>
      <input type="hidden" name="next" value="{{ next }}">
    </form>

    <p class="auth-switch">Ainda não tem conta? <a href="{% url 'cadastro' %}">Cadastre-se</a></p>
  </div>
</div>
{% endblock %}
